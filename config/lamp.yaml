# Reusable LAMP workflow configuration.
#
# Replace these paths for another target species or project. The candidate FASTA
# is the output of the upstream repeat discovery/specificity stages.

target_assembly: data/raw/tropi_assembly.fasta
candidate_fasta: results/candidates/unique_candidates.fasta

# Keep these as a YAML list. They are passed to both BLAST-based and
# raw-FASTA independent verification.
off_targets:
  - data/reference/Apis_cerana.fna
  - data/reference/Apis_mellifera.fna
  - data/reference/Varroa_destructor.fna
  - data/reference/Varroa_jacobsoni.fna

results_dir: results/candidates
work_dir: data/interim
threads: 8
