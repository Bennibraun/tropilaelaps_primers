name: tropi-primers
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- core assembly / sequence handling ---
  - seqkit            # fast FASTA/FASTQ manipulation & stats
  - samtools
  - bedtools
  - python>=3.11
  - biopython
  - regex             # fuzzy/approximate substring matching — scripts/06b (independent verification)

  # --- repeat / satellite discovery ---
  # RepeatModeler is NOT run by this repo (it's one of the heaviest/most fragile
  # bioconda installs and a multi-hour-to-multi-day job). We take its output
  # (a families FASTA) as an input to scripts/02_repeat_discovery.sh instead —
  # see docs/plan.md, Stage 2. TRF runs locally; it's fast and lightweight.
  - trf               # tandem repeats finder (satellites) — scripts/02
  - mafft             # align candidate copies for conserved-core detection — scripts/04

  # --- specificity screening (the critical step) ---
  - blast             # makeblastdb + blastn against off-targets (03) and self-mapping (04)
  - minimap2          # fast long-read/asm-vs-asm mapping (03b)
  - mummer4           # nucmer whole-genome alignment for shared regions (manual cross-check, see docs/plan.md)

  # --- primer / probe design ---
  - primer3           # primer3_core
  - primer3-py        # scripting wrapper — scripts/05

  # --- in-silico PCR validation ---
  - ispcr             # UCSC isPcr — scripts/06
  - ucsc-fatotwobit   # isPcr needs .2bit genome databases — scripts/06

  # --- reference acquisition ---
  - ncbi-datasets-cli # download off-target genomes by accession
  - entrez-direct     # fetch T. clareae congener markers (no genome exists)
  - sra-tools         # prefetch/fasterq-dump congener WGS reads if/when available

  # --- workflow + analysis ---
  - snakemake-minimal
  - pandas
  - numpy
  - jupyterlab
  - matplotlib
